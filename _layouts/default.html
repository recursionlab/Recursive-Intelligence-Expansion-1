:root {

/* Dark mode overrides */

}

/* === Base Styles === */
body {

  line-height: 1.6;
  color: var(--text-color);

  transition: background-color 0.3s ease, color 0.3s ease;
}

h1, h2, h3, h4, h5, h6 {
  line-height: 1.25;
  margin-top: 1.5em;
  margin-bottom: 0.5em;
  color: var(--heading-color);
}

h1 { font-size: 2rem; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.3rem; }

p {
  font-size: inherit;
  line-height: inherit;
}

/* === Link Styles (Variable-Driven) === */
a {
  color: var(--link-color);
  text-decoration: underline;
  font-weight: 500;
  transition: background-color 0.2s ease;
}

a:visited {
  color: var(--visited-color);
}

a:hover,
a:focus {
  text-decoration: none;
  background-color: var(--hover-bg);

}

:focus {
  outline: 2px dashed var(--outline-focus);
  outline-offset: 3px;
}

/* === Typography === */
p {
  font-size: inherit;
  line-height: inherit;
}

h1, h2, h3, h4, h5, h6 {
  line-height: 1.25;
  margin-top: 1.5em;
  margin-bottom: 0.5em;
  color: var(--heading-light);
}

h1 { font-size: 2rem; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.3rem; }

/* === Links === */
a {
  color: var(--link-light);
  text-decoration: underline;
  font-weight: 500;
  transition: background-color 0.2s ease;
}

a:visited {
  color: var(--visited-light);
}

a:hover,

  text-decoration: none;

}

}

/* === Lists and Navigation Touch Targets === */
ul li {

}

ul li a {

  min-height: 44px;

}

/* === Scroll-Aware === */
.scroll-app-style {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  white-space: nowrap;
  padding-inline: 1rem;
}

.scroll-app-style[data-scroll-fade] {
  mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
}

/* === Hide Scrollbars on Mobile === */
@media (max-width: 768px) {
  .scroll-app-style::-webkit-scrollbar {

}

table {

@media (max-width: 768px) {

/* === Responsive Typography === */

        /* === Highlight tab-focused links === */
a:focus-visible {

  border-radius: 4px;
  transition: outline 0.2s ease, background-color 0.2s ease;
}

/* === Highlight current page link using exact match (JS assisted below) === */
a[data-current] {
  font-weight: bold;
  border-bottom: 2px solid var(--link-color, #0055aa);
  background-color: var(--hover-bg, #dcefff);
  color: var(--link-color, #0055aa);
  border-radius: 4px;
}

/* === Dark Mode Support === */
@media (prefers-color-scheme: dark) {
  a:focus-visible {
    outline-color: var(--link-color, #66ccff);
    background-color: var(--hover-bg-dark, rgba(102, 204, 255, 0.15));
  }

  a[data-current] {
    background-color: var(--hover-bg-dark, rgba(102, 204, 255, 0.15));
    color: var(--link-color, #66ccff);
    border-bottom-color: var(--link-color, #66ccff);
  }
}
